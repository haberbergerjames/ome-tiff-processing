[project]
name = "ome-tiff-processing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "James Haberberger", email = "haberbergerjames@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anywidget>=0.11.0",
    "dash>=4.5.1",
    "imagecodecs>=2026.11.11",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "plotly>=7.2.0",
    "tifffile>=2026.11.16",
    "torch>=2.15.0",
    "xarray>=2026.9.0",
    "xmltodict>=1.0.4",
    "zarr>=3.4.2",
]

[project.scripts]
ome-tiff-processing = "ome_tiff_processing:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
